<!DOCTYPE html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background-color:#08050f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#08050f;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="max-width:440px;width:100%;background:linear-gradient(180deg,#161022 0%,#0e0a18 100%);border:1px solid rgba(168,85,247,0.18);border-radius:22px;overflow:hidden;">
          <tr>
            <td style="padding:36px 32px 8px;text-align:center;">
              <img src="https://bvydxgjotxxkkszubvbx.supabase.co/storage/v1/object/public/painel-uploads/logo-painel/nyx-brand-email-1788895983975.png" alt="Nyx" width="64" height="64" style="width:64px;height:64px;border-radius:16px;display:inline-block;" />
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 0;text-align:center;">
              <h1 style="margin:0;color:#f5f3fa;font-size:20px;font-weight:700;">Redefinir senha</h1>
              <p style="margin:8px 0 0;color:#a89fc0;font-size:13.5px;line-height:1.6;">
                Recebemos um pedido pra trocar a senha da conta <strong style="color:#d8b4fe;">{{ .Email }}</strong>.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px;text-align:center;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(163deg,#a855f7 14%,#6d28d9 86%);color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 32px;border-radius:999px;">
                Redefinir senha
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 36px;text-align:center;">
              <p style="margin:0;color:#6b6280;font-size:11.5px;line-height:1.6;">
                Se você não pediu essa troca, ignore este e-mail — sua senha continua a mesma.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
